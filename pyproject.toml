[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-of-life"
version = "0.1.0"
description = "A small Conway's Game of Life simulation."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
]

[project.scripts]
life = "animation:main"
screensaver = "animation:screensaver"

[tool.setuptools]
py-modules = [
    "animation",
    "creation",
    "nearest_neighbours",
    "step",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"